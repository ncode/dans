name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - name: Test release integrity
        run: scripts/release_test.sh
      - name: Build and verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          release_dir="dist/$GITHUB_REF_NAME"
          scripts/release.sh build "$GITHUB_REF_NAME" "$release_dir"
          scripts/release.sh verify "$release_dir"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify OCI footprints and command surfaces
        shell: bash
        run: |
          scripts/oci-smoke.sh dans-release-smoke linux/amd64 "$GITHUB_REF_NAME"
          scripts/oci-smoke.sh dans-release-smoke linux/arm64 "$GITHUB_REF_NAME"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="dist/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            "$release_dir/SHA256SUMS" \
            "$release_dir/dans_${GITHUB_REF_NAME}_linux_amd64" \
            "$release_dir/dans_${GITHUB_REF_NAME}_linux_arm64" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
